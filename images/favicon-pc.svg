<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="8" fill="#2f5233"/>

  <!-- épi entier, incliné en diagonale -->
  <g transform="rotate(-42 32 32)">

    <!-- tige -->
    <line x1="32" y1="53" x2="32" y2="14" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>

    <!-- grain-type : goutte pointue, base en (0,0), pointe vers le haut en (0,-13) -->
    <!-- chaque grain est positionné le long de la tige puis pivoté pour pointer vers le haut et vers l'extérieur -->
    <g fill="#ffffff">
      <path d="M -3,0 Q -4,-7 0,-13 Q 4,-7 3,0 Q 0,1.5 -3,0 Z" transform="translate(32,48) rotate(-27)"/>
      <path d="M -3,0 Q -4,-7 0,-13 Q 4,-7 3,0 Q 0,1.5 -3,0 Z" transform="translate(32,48) rotate(27)"/>

      <path d="M -3,0 Q -4,-7 0,-13 Q 4,-7 3,0 Q 0,1.5 -3,0 Z" transform="translate(32,41) rotate(-25)"/>
      <path d="M -3,0 Q -4,-7 0,-13 Q 4,-7 3,0 Q 0,1.5 -3,0 Z" transform="translate(32,41) rotate(25)"/>

      <path d="M -2.7,0 Q -3.7,-6.5 0,-12 Q 3.7,-6.5 2.7,0 Q 0,1.3 -2.7,0 Z" transform="translate(32,34) rotate(-22)"/>
      <path d="M -2.7,0 Q -3.7,-6.5 0,-12 Q 3.7,-6.5 2.7,0 Q 0,1.3 -2.7,0 Z" transform="translate(32,34) rotate(22)"/>

      <path d="M -2.4,0 Q -3.2,-6 0,-11 Q 3.2,-6 2.4,0 Q 0,1.2 -2.4,0 Z" transform="translate(32,27) rotate(-18)"/>
      <path d="M -2.4,0 Q -3.2,-6 0,-11 Q 3.2,-6 2.4,0 Q 0,1.2 -2.4,0 Z" transform="translate(32,27) rotate(18)"/>

      <path d="M -2.1,0 Q -2.8,-5.4 0,-10 Q 2.8,-5.4 2.1,0 Q 0,1 -2.1,0 Z" transform="translate(32,21) rotate(-14)"/>
      <path d="M -2.1,0 Q -2.8,-5.4 0,-10 Q 2.8,-5.4 2.1,0 Q 0,1 -2.1,0 Z" transform="translate(32,21) rotate(14)"/>

      <!-- pointe de l'épi, tout droit vers le haut -->
      <path d="M -2.2,0 Q -3,-6 0,-11.5 Q 3,-6 2.2,0 Q 0,1 -2.2,0 Z" transform="translate(32,13)"/>
    </g>
  </g>
</svg>
